[OnlineSubsystem]
DefaultPlatformService=GooglePlay
NativePlatformService=GooglePlay
LocalPlatformName=AND

[OnlineSubsystemGooglePlay.Store]
bSupportsInAppPurchasing=true

[Audio]
AudioMixerModuleName=AudioMixerOpenHarmony
AudioDeviceModuleName=OpenHarmonyAudio
UseAudioMixer=true

[OnlineServices.EOS.Auth]
DefaultExternalCredentialTypeStr=Google

[/Script/OpenHarmonyTargetPlatform.OpenHarmonyTargetSettings]
bEnableRayTracing=true

;Uncomment to turn on AndroidBackgroundHttp through the AndroidFetchBackgroundDownload and AndroidBackgroundService modules
;[BackgroundHttp]
;PlatformModularFeatureName=AndroidFetchBackgroundDownload
[SF_VULKAN_SM5_OPENHARMONY]
; Bindless is necessary for Vulkan ray tracing hit-group shaders.
; RT shaders compile with an SM6.6 profile where resource arrays are legal;
; non-RT SM5 shaders must stay bindful (arrays of UAVs are illegal at SM5).
BindlessResources=RayTracingShaders
BindlessSamplers=RayTracingShaders
